name: fork release

# Rebuilds the latest zeronsh/zeron release with the fork's patch stack (the
# commits on this repo's main that upstream main lacks) and publishes it here
# as the latest release. Those builds point the in-app updater at this repo, so
# installed copies keep getting upstream releases without losing the patches.
# A patch the release already contains drops out; once upstream ships every
# patch, the build is stock and points back at the official feed.
#
# sync/zeron-fork-sync.sh keeps main rebased on upstream main and dispatches
# this workflow after each push; the daily schedule catches the rest.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream version and patch stack are already published
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-release

env:
  UPSTREAM: zeronsh/zeron

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      stack: ${{ steps.plan.outputs.stack }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          tag=$(gh api "repos/$UPSTREAM/releases/latest" -q .tag_name)
          git fetch -q --no-tags "https://github.com/$UPSTREAM.git" "+refs/heads/main:refs/remotes/upstream/main"
          # Content fingerprint of the patch stack: unchanged by the hourly rebases, changed by a new or edited patch.
          base=$(git merge-base origin/main upstream/main)
          stack=$(git log -p --reverse "$base..origin/main" | git patch-id --stable | cut -d' ' -f1 | sha256sum | cut -c1-12)
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "stack=$stack" >>"$GITHUB_OUTPUT"
          published=$(gh release view "fork-${tag#v}" -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          if [ "$FORCE" != true ] && grep -qF "patch stack \`$stack\`" <<<"$published"; then
            echo "fork-${tag#v} with patch stack $stack already published"
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      STACK: ${{ needs.plan.outputs.stack }}
      FEED: https://github.com/${{ github.repository }}/releases/latest/download
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: apply the patch stack to the upstream release
        id: src
        run: |
          git config user.name "fork-release"
          git config user.email "fork-release@users.noreply.github.com"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" \
            "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/main:refs/remotes/upstream/main"
          git checkout -q -B build origin/main
          echo "FORK_MAIN=$(git rev-parse --short origin/main)" >>"$GITHUB_ENV"
          # Patches the release already contains come out empty and are dropped.
          git rebase --onto "$TAG" "$(git merge-base HEAD upstream/main)"
          git log --reverse --format='- %s' "$TAG..HEAD" >"$RUNNER_TEMP/patches"
          if [ -s "$RUNNER_TEMP/patches" ]; then patched=true; else patched=false; fi
          echo "patched=$patched" >>"$GITHUB_OUTPUT"
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          [ "v$version" = "$TAG" ] || { echo "Cargo.toml $version does not match $TAG"; exit 1; }
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: point the updater at this fork
        if: steps.src.outputs.patched == 'true'
        run: |
          plutil -insert LSEnvironment -json "{\"ZERON_RELEASES_URL\":\"$FEED\"}" dist/macos/Info.plist

      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: package
        run: scripts/package-macos.sh

      - name: verify the bundle
        env:
          PATCHED: ${{ steps.src.outputs.patched }}
        run: |
          app=target/package/Zeron.app
          [ "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION" ]
          if [ "$PATCHED" = true ]; then
            [ "$(plutil -extract LSEnvironment.ZERON_RELEASES_URL raw "$app/Contents/Info.plist")" = "$FEED" ]
          else
            ! plutil -extract LSEnvironment.ZERON_RELEASES_URL raw "$app/Contents/Info.plist" 2>/dev/null
          fi

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHED: ${{ steps.src.outputs.patched }}
        run: |
          cd target/package
          app="zeron-$VERSION-macos-arm64-app.tar.gz"
          dmg="zeron-$VERSION-macos-arm64.dmg"
          jq -n --arg v "$VERSION" --arg n "$app" --arg s "$(shasum -a 256 "$app" | cut -d' ' -f1)" \
            '{version: $v, files: {($n): {sha256: $s}}}' >manifest.json
          release="fork-$VERSION"
          gh release delete "$release" -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          git tag -f "$release"
          git push -f origin "refs/tags/$release"
          if [ "$PATCHED" = true ]; then
            what="Upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) plus the patches on fork main ($FORK_MAIN), patch stack \`$STACK\`:

          $(cat "$RUNNER_TEMP/patches")

          The in-app updater follows this repo's releases."
          else
            what="Upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) unmodified; it already includes every patch (patch stack \`$STACK\`). Installing it returns the updater to the official feed."
          fi
          notes="$what

          Apple silicon, ad-hoc signed, not notarized. After a manual install from the dmg run:

              xattr -dr com.apple.quarantine /Applications/Zeron.app"
          gh release create "$release" "$dmg" "$app" manifest.json -R "$GITHUB_REPOSITORY" \
            --verify-tag --latest --title "Zeron $VERSION (fork)" --notes "$notes"
